# Alembic config. The database URL comes from SYSTEMCRAFT_DATABASE_URL (or the
# SQLite fallback), never from this file. Run from the repo root:
#   alembic -c backend/alembic.ini upgrade head
# The app also runs "upgrade head" on startup, so a deploy migrates itself.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/..
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
