      - { number: 10, topic: kafka-event-streaming, title: Queues and streams, note: "Older lesson format until it is rewritten." }
      - { number: 11, topic: distributed-rate-limiter, title: Rate limiting, note: "Older lesson format until it is rewritten." }
      - { number: 12, topic: idempotency-and-circuit-breakers, title: "Retries, idempotency and circuit breakers", note: "Older lesson format until it is rewritten." }
