id: start-here
title: Start here
summary: One fixed path through the fundamentals. Every new learner starts at chapter 1; the app always shows the next chapter to continue.
stages:
  - id: stage-0
    title: "Stage 0 · On-ramp"
    summary: How to approach a design round, how a web system grows, and the numbers that decide it.
    chapters:
      - { number: 1, topic: how-to-approach-a-design-question, title: How to approach a design question }
      - { number: 2, topic: one-server-to-a-million-users, title: From one server to a million users }
      - { number: 3, topic: numbers-that-matter, title: Numbers that matter }
  - id: stage-1
    title: "Stage 1 · Building blocks"
    summary: The parts every design reuses, in the order a learner needs them.
    chapters:
