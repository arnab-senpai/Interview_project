id: start-here
title: Learn system design
summary: "Twenty chapters in order, from one server to the designs interviewers ask for. Start at chapter 1; your next step is always at the top."
stages:
  - id: stage-0
    title: "Stage 0 · On-ramp"
    summary: How to approach a design round, how a web system grows, and the numbers that decide it.
    chapters:
      - { number: 1, topic: how-to-approach-a-design-question, title: How to approach a design question }
      - { number: 2, topic: one-server-to-a-million-users, title: From one server to a million users }
      - { number: 3, topic: numbers-that-matter, title: Numbers that matter }
  - id: stage-1
    title: "Stage 1 · Building blocks"
    summary: The parts every design reuses, in the order a learner needs them.
    chapters:
      - { number: 4, topic: l7-load-balancer, title: Load balancing }
      - { number: 5, topic: caching-and-stampede, title: Caching and the stampede }
      - { number: 6, topic: dns-and-cdn, title: DNS and CDN }
      - { number: 7, topic: replication-and-consensus, title: Databases and replication }
      - { number: 8, topic: cap-and-pacelc, title: Consistency and CAP, status: planned }
      - { number: 9, topic: sharding-and-hot-keys, title: Sharding and consistent hashing }
      - { number: 10, topic: kafka-event-streaming, title: Queues and streams }
      - { number: 11, topic: distributed-rate-limiter, title: Rate limiting }
      - { number: 12, topic: idempotency-and-circuit-breakers, title: "Retries, idempotency and circuit breakers" }
  - id: stage-2
    title: "Stage 2 · Guided designs"
    summary: Classic interview designs, built step by step with the same template.
    chapters:
      - { number: 13, topic: url-shortener, title: URL shortener }
      - { number: 14, topic: rate-limiter-system, title: Rate limiter, status: planned }
      - { number: 15, topic: unique-id-generator, title: Unique ID generator, status: planned }
      - { number: 16, topic: distributed-kv-store, title: Key-value store, status: planned }
      - { number: 17, topic: news-feed, title: News feed }
      - { number: 18, topic: whatsapp-chat, title: Chat }
      - { number: 19, topic: notification-system, title: Notification system, status: planned }
      - { number: 20, topic: video-streaming, title: Video streaming }
