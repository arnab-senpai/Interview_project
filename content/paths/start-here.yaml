      - { number: 5, topic: caching-and-stampede, title: Caching and the stampede }
      - { number: 6, topic: dns-and-cdn, title: DNS and CDN, note: "Older lesson format until it is rewritten." }
      - { number: 7, topic: replication-and-consensus, title: Databases and replication, note: "Older lesson format until it is rewritten." }
      - { number: 8, topic: cap-and-pacelc, title: Consistency and CAP }
