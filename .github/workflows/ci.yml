name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  content-lint:
    name: Content lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Zero-dependency validator: structural and quiz-quality checks fail the build;
      # prose heuristics (absolutes, exclamation marks, missing lastVerified) are printed as warnings only.
      - run: python backend/scripts/validate_content.py

  tests:
    name: Backend tests and frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest -q
